name: freecode
services:
  postgres:
    image: docker.io/library/postgres:18.6-alpine3.24
    container_name: freecode-postgres
    environment:
      POSTGRES_USER: freecode
      POSTGRES_DB: freecode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行 bun run db:up}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54324}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./apps/server/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freecode -d freecode"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
